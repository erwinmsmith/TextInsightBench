[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textinsightbench"
version = "5.1.0"
description = "Evidence-grounded agent mining of natural-language datasets"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21,<5", "huggingface-hub>=1.0,<2"]

[project.optional-dependencies]
data = ["pyarrow>=15", "datasets>=3"]

[project.scripts]
tib = "textinsightbench.cli:main"

[tool.setuptools.packages.find]
include = ["textinsightbench*"]

[tool.setuptools.package-data]
textinsightbench = ["*.json", "*.txt"]
